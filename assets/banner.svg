<svg width="1280" height="480" viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0b0f1f"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="480" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="100" r="220" fill="#6366f1" opacity="0.22" filter="url(#blurGlow)"/>
  <circle cx="1080" cy="380" r="260" fill="#a855f7" opacity="0.2" filter="url(#blurGlow)"/>
  <circle cx="850" cy="120" r="180" fill="#06b6d4" opacity="0.18" filter="url(#blurGlow)"/>

  <!-- Subtle Studio Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M 0 60 L 1280 60 M 0 120 L 1280 120 M 0 180 L 1280 180 M 0 240 L 1280 240 M 0 300 L 1280 300 M 0 360 L 1280 360 M 0 420 L 1280 420"/>
    <path d="M 80 0 L 80 480 M 160 0 L 160 480 M 240 0 L 240 480 M 320 0 L 320 480 M 400 0 L 400 480 M 480 0 L 480 480 M 560 0 L 560 480 M 640 0 L 640 480 M 720 0 L 720 480 M 800 0 L 800 480 M 880 0 L 880 480 M 960 0 L 960 480 M 1040 0 L 1040 480 M 1120 0 L 1120 480 M 1200 0 L 1200 480"/>
  </g>

  <!-- Left: Brand & Typography -->
  <g transform="translate(100, 130)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#22c55e"/>
    <text x="28" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">GOOGLE CHROME EXTENSION</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      SmoothFlow<tspan fill="url(#primaryGrad)"> Studio</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Cinematic Scroll Director &bull; Virtual Cursor Physics &bull; Synchronized 60 FPS Video
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🎯 Section-to-Section</text>

      <rect x="142" y="0" width="125" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="156" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🌊 Butter Easing</text>

      <rect x="279" y="0" width="120" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="293" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">🎥 60 FPS Capture</text>
    </g>
  </g>

  <!-- Right: Floating Studio HUD Graphic Mockup -->
  <g transform="translate(740, 60)" filter="url(#softShadow)">
    <!-- HUD Window Card -->
    <rect width="440" height="360" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- HUD Header -->
    <line x1="0" y1="56" x2="440" y2="56" stroke="rgba(255, 255, 255, 0.08)"/>
    <circle cx="28" cy="28" r="6" fill="#ef4444"/>
    <circle cx="48" cy="28" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="28" r="6" fill="#10b981"/>

    <text x="175" y="33" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">SmoothFlow Director</text>
    
    <!-- REC Badge -->
    <rect x="345" y="16" width="70" height="24" rx="12" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <circle cx="358" cy="28" r="4" fill="#ef4444"/>
    <text x="368" y="32" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">60 FPS</text>

    <!-- Curve Timeline Display -->
    <g transform="translate(24, 76)">
      <rect width="392" height="110" rx="12" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.06)"/>
      <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CINEMATIC QUINTIC BEZIER CURVE</text>
      
      <!-- Motion Curve -->
      <path d="M 30 85 C 100 85, 140 70, 200 45 C 260 20, 310 25, 360 25" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="30" cy="85" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
      <circle cx="200" cy="45" r="4" fill="#a855f7"/>
      <circle cx="360" cy="25" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Controls Row -->
    <g transform="translate(24, 206)">
      <!-- Duration Card -->
      <rect x="0" y="0" width="186" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Glide Duration</text>
      <text x="14" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">5.0s <tspan fill="#6366f1" font-size="12">Cinematic</tspan></text>

      <!-- Physics Mode Card -->
      <rect x="206" y="0" width="186" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Cursor Physics</text>
      <text x="14" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Spring <tspan fill="#10b981" font-size="12">Damped</tspan></text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="186" height="44" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="64" y="27" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">▶ Preview (⌘⇧S)</text>

      <rect x="206" y="0" width="186" height="44" rx="10" fill="url(#primaryGrad)"/>
      <circle cx="250" cy="22" r="5" fill="#ffffff"/>
      <text x="264" y="27" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Record 60FPS</text>
    </g>
  </g>
</svg>
